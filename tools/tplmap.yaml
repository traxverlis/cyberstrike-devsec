name: "tplmap"
command: "tplmap"
enabled: true
short_description: "SSTI Server-Side Template Injection"
description: |
  Tplmap est un outil de détection et d'exploitation des vulnérabilités
  Server-Side Template Injection (SSTI). Supporte Jinja2, Twig, Smarty,
  Mako, Freemarker, Velocity et bien d'autres moteurs de templates.
  Peut atteindre l'exécution de code arbitraire via des templates vulnérables.
  PTES phase: 4 — Vulnerability Analysis / 5 — Exploitation
parameters:
  - name: "target"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "engine"
    type: "string"
    description: "Moteur de template (jinja2, twig, smarty...)"
    required: false
    flag: "--engine"
    format: "flag"
  - name: "os_shell"
    type: "boolean"
    description: "Tenter d'obtenir un shell OS"
    required: false
    flag: "--os-shell"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Arguments supplémentaires"
    required: false
    format: "positional"
