name: "syft"
command: "syft"
enabled: true
short_description: "SBOM (Software Bill of Materials) generator for container images and filesystems"
description: |
  Syft is an open-source CLI tool and Go library by Anchore for generating Software Bill
  of Materials (SBOMs) from container images, filesystems, and archives. It identifies
  packages, libraries, and their metadata across many ecosystems (OS packages, npm, Python,
  Java, Go, .NET, etc.). SBOMs generated by Syft can be fed into Grype for vulnerability
  scanning, or shared for supply chain transparency and compliance (NTIA SBOM requirements).
  Supports CycloneDX, SPDX, and Syft-native JSON formats.
parameters:
  - name: "source"
    type: "string"
    description: "Source to generate SBOM from: container image (e.g. nginx:latest), directory path, file, or OCI archive"
    required: true
    format: "positional"
    position: 0

  - name: "output-format"
    type: "string"
    description: "SBOM output format"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
    options: ["json", "cyclonedx-json", "cyclonedx-xml", "spdx-json", "spdx-tag-value", "table", "text", "template"]

  - name: "scope"
    type: "string"
    description: "Selection of layers to catalog when scanning a container image"
    required: false
    flag: "--scope"
    format: "flag"
    default: "squashed"
    options: ["squashed", "all-layers"]

  - name: "file"
    type: "string"
    description: "File path to write SBOM output to (default: stdout)"
    required: false
    flag: "--file"
    format: "flag"

  - name: "config"
    type: "string"
    description: "Path to a Syft configuration file (.syft.yaml)"
    required: false
    flag: "--config"
    format: "flag"

  - name: "platform"
    type: "string"
    description: "Target platform for multi-arch image scanning (e.g. linux/amd64)"
    required: false
    flag: "--platform"
    format: "flag"

  - name: "exclude"
    type: "string"
    description: "Glob pattern of paths to exclude from the SBOM (can be repeated)"
    required: false
    flag: "--exclude"
    format: "flag"

  - name: "quiet"
    type: "boolean"
    description: "Suppress all output except the SBOM itself"
    required: false
    flag: "--quiet"
    format: "flag"
    default: false

  - name: "source-name"
    type: "string"
    description: "Override the name of the source in the generated SBOM"
    required: false
    flag: "--source-name"
    format: "flag"

  - name: "source-version"
    type: "string"
    description: "Override the version of the source in the generated SBOM"
    required: false
    flag: "--source-version"
    format: "flag"
