name: "arjun"
command: "arjun"
enabled: true
short_description: "Découverte de paramètres cachés"
description: |
  Arjun est un outil de découverte de paramètres HTTP pour les APIs
  et applications web. Il détecte les paramètres GET/POST/JSON/XML
  cachés en utilisant des wordlists et des techniques d'inférence.
  Idéal pour trouver des endpoints oubliés ou non documentés.
  PTES phase: 3 — Scanning / 4 — Vulnerability Analysis
parameters:
  - name: "target"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "method"
    type: "string"
    description: "Méthode HTTP (GET/POST)"
    required: false
    flag: "-m"
    format: "flag"
  - name: "output"
    type: "string"
    description: "Fichier de sortie JSON"
    required: false
    flag: "-o"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Arguments supplémentaires"
    required: false
    format: "positional"
