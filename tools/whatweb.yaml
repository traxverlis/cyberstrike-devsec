name: "whatweb"
command: "whatweb"
enabled: true
short_description: "Web technology fingerprinting — CMS, frameworks, server software, versions"
description: |
  WhatWeb identifies web technologies including content management systems (CMS),
  blogging platforms, JavaScript libraries, web servers, and embedded devices.
  Used in PTES Phase 2 (Information Gathering) to build the technology stack map.

  **Main features:**
  - 1800+ plugins for technology detection
  - Passive and aggressive scanning modes
  - JSON/XML/CSV output formats
  - Identifies: WordPress, Drupal, Joomla, Apache, Nginx, PHP, jQuery...

  **PTES phase:** 2 — Information Gathering

  ⚠️ Aggressive mode generates HTTP traffic — use only on authorized targets.

parameters:
  - name: "target"
    type: "string"
    description: "Target URL or IP address (e.g. https://example.com)"
    required: true
    position: 0
    format: "positional"

  - name: "aggression"
    type: "string"
    description: "Aggression level: 1=stealthy, 3=aggressive, 4=heavy"
    required: false
    flag: "--aggression"
    format: "flag"
    default: "1"
    options: ["1", "2", "3", "4"]

  - name: "log-json"
    type: "string"
    description: "Log to JSON file path"
    required: false
    flag: "--log-json"
    format: "flag"

  - name: "quiet"
    type: "bool"
    description: "Quiet mode — suppress banner"
    required: false
    flag: "--quiet"
    format: "flag"
    default: false

  - name: "additional_args"
    type: "string"
    description: "Extra WhatWeb arguments"
    required: false
    format: "positional"
