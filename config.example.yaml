# AI Provider Configuration Examples

## GitHub Copilot (recommended — zero extra cost)
ai:
  provider: "openai-compatible"
  base_url: "https://api.githubcopilot.com"
  api_key: "${GITHUB_COPILOT_TOKEN}"
  model: "claude-sonnet-4.5"
  temperature: 0.1
  max_tokens: 4096

