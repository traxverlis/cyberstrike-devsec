# config.example.yaml — Exemples de configuration provider IA
# ──────────────────────────────────────────────────────────────
# Copier le bloc de ton provider dans config.yaml
# IMPORTANT : format à plat uniquement (pas de sous-niveau "ai:")

# ── GitHub Copilot (recommandé — inclus dans l'abonnement) ───
# base_url: "https://api.business.githubcopilot.com"
# api_key: "${GITHUB_COPILOT_TOKEN}"
# model: "gpt-4o"
# temperature: 0.1
# max_tokens: 4096

# ── OpenAI ───────────────────────────────────────────────────
# base_url: "https://api.openai.com/v1"
# api_key: "${OPENAI_API_KEY}"
# model: "gpt-4o"
# temperature: 0.1
# max_tokens: 4096

# ── Ollama (local, 0 coût, 0 internet) ───────────────────────
# base_url: "http://localhost:11434/v1"
# api_key: "ollama"
# model: "llama3:8b"
# temperature: 0.1
# max_tokens: 4096

# ── Anthropic (Claude) ────────────────────────────────────────
# base_url: "https://api.anthropic.com/v1"
# api_key: "${ANTHROPIC_API_KEY}"
# model: "claude-sonnet-4-5"
# temperature: 0.1
# max_tokens: 4096

