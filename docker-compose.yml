# CyberStrikeAI DevSec — Docker Compose
# Image unique tout-en-un avec tous les outils
#
# Usage rapide :
#   docker compose run devsec scan
#   docker compose run devsec scan --mode full
#   docker compose run devsec verify
#   docker compose run devsec help

version: "3.9"

services:

  # ── Service principal — tous les outils dans un seul conteneur ─────────────
  devsec:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyberstrike-devsec:latest
    container_name: cyberstrike-devsec
    working_dir: /app
    volumes:
      # Projet à scanner → /workspace dans le conteneur
      - ${PROJECT_PATH:-.}:/workspace:ro
      # Rapports de sortie
      - ${REPORTS_PATH:-./security-reports}:/reports
      # Consentements Level 2/3
      - ${CONSENTS_PATH:-./reports/consent}:/app/reports/consent
      # config.yaml pour l'IA (optionnel)
      - ${CONFIG_PATH:-./config.yaml}:/app/config.yaml:ro
    environment:
      # GitHub Copilot (pour --ai)
      - GITHUB_COPILOT_TOKEN=${GITHUB_COPILOT_TOKEN:-}
      # OpenAI (alternatif)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # NVD API key (accélère grype/trivy)
      - NVD_API_KEY=${NVD_API_KEY:-}
    network_mode: bridge
    # Nécessaire pour nmap (raw sockets)
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Empêcher les scans non autorisés depuis le conteneur
    security_opt:
      - no-new-privileges:true
    command: help

  # ── Build uniquement (pour CI/CD) ──────────────────────────────────────────
  devsec-ci:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyberstrike-devsec:latest
    volumes:
      - ${PROJECT_PATH:-.}:/workspace:ro
      - ${REPORTS_PATH:-./security-reports}:/reports
    environment:
      - GITHUB_COPILOT_TOKEN=${GITHUB_COPILOT_TOKEN:-}
    network_mode: bridge
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: scan --mode cicd --output /reports
    profiles:
      - ci
