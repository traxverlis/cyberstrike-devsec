# devsec.conf — Configuration CyberStrikeAI DevSec
# ──────────────────────────────────────────────────
# Modifie ce fichier puis lance simplement :
#
#   ./scripts/scan.sh          → Level 1 (code source)
#   ./scripts/scan-web.sh      → Level 2 (site web, nécessite consentement)
#
# Pas besoin de retenir les options — tout est ici.

# ── Cible ─────────────────────────────────────────
# Pour scan.sh (Level 1) : chemin vers le projet à analyser
TARGET=.

# Pour scan-web.sh (Level 2) : URL du site à scanner
TARGET_URL=https://app.example.com

# ── Mode de scan (Level 1 uniquement) ─────────────
# quick  → secrets + CVE critiques (~30s)
# full   → analyse complète (~5-15min)  ← recommandé
# cicd   → JSON + exit codes stricts (pour pipelines)
MODE=full

# ── Sévérité minimale à remonter ──────────────────
# critical | high | medium | low
SEVERITY=high

# ── Dossier de sortie des rapports ────────────────
OUTPUT=./security-reports

# ── Mode IA ───────────────────────────────────────
# true  → analyse IA activée (GitHub Copilot)
# false → scan seul, sans IA
AI=false

# Modèle IA à utiliser (si AI=true)
# claude-opus-4.6 | claude-sonnet-4.6 | claude-haiku-4.5 | gpt-5-mini
AI_MODEL=claude-opus-4.6

# Niveau de raisonnement IA (low | medium | high)
AI_REASONING=medium

# ── Git history ───────────────────────────────────
# true  → ne pas scanner l'historique git (plus rapide)
# false → scan complet incluant l'historique
NO_GIT=false

# ── Consentement Level 2 ──────────────────────────
# Chemin vers le PDF signé (obligatoire pour scan-web.sh)
CONSENT=./reports/consent/consent-localhost-5001-signed.pdf
